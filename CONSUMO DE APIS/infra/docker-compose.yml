services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3035:3005"
    networks:
      - soa_network
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "4045:4005"
    networks:
      - soa_network

networks:
  soa_network:
    driver: bridge
